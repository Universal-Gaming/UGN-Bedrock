name: Build and deploy UGN Java browser game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only release protocols for which the pinned browser client contains
# valid block/item definitions. Upstream has unsupported 26.x listings
# that should not be advertised in UGN browser builds.
env:
  MAX_MC_VERSION: '1.21.5'

concurrency:
  group: ugn-java-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Check out UGN website
        uses: actions/checkout@v4
        with:
          path: ugn
          persist-credentials: false

      - name: Check out pinned MIT-licensed Java browser client
        uses: actions/checkout@v4
        with:
          repository: zardoy/minecraft-web-client
          ref: d7ab705efee3af674421c65e62b660ae470cad6b
          path: upstream
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      # The pinned upstream revision's patchedDependencies and pnpm lockfile
      # differ. A strict frozen-lockfile install fails before compiling.
      - name: Install pinned game dependencies
        working-directory: upstream
        run: pnpm install --no-frozen-lockfile

      - name: Apply UGN-only game menu configuration
        run: |
          node ugn/scripts/configure-client.mjs upstream ugn/server-config.json
          node -e "const c=require('./upstream/config.json'); if(!Array.isArray(c.promoteServers)) process.exit(1); console.log('UGN promoted server count:',c.promoteServers.length)"

      - name: Apply UGN in-game main menu theme
        run: |
          node --check ugn/scripts/theme-client.mjs
          node ugn/scripts/theme-client.mjs upstream

      - name: Fix embedded game mouse look and pointer capture
        run: |
          node --check ugn/scripts/fix-mouse-look.mjs
          node ugn/scripts/fix-mouse-look.mjs upstream
          grep -q 'const attempt = document.documentElement.requestPointerLock()' upstream/src/utils.ts
          ! grep -q 'unadjustedMovement: options.mouseRawInput' upstream/src/utils.ts
          node ugn/scripts/test-mouse-look.mjs upstream
          node --check ugn/scripts/install-mouse-controls.mjs
          node ugn/scripts/install-mouse-controls.mjs upstream
          grep -q 'UGNMouseDiagnostics' upstream/src/controls.ts
          grep -q 'ugn-drag' upstream/src/controls.ts
          grep -q 'ugnMouseStats.cameraUpdates' upstream/src/cameraRotationControls.ts

      - name: Build genuine Java-compatible browser client
        working-directory: upstream
        env:
          CI: 'true'
          GITHUB_REPOSITORY: 'Universal-Gaming/UGN-Bedrock'
          MAIN_MENU_LINKS: 'UGN GitHub:https://github.com/Universal-Gaming/UGN-Bedrock;UGN Website:https://universalgaming.us/'
          CONFIG_JSON_SOURCE: 'BUNDLED'
          GENDATA_EXT_URL: 'off'
          DISABLE_SERVICE_WORKER: 'true'
        run: pnpm build

      - name: Verify compiled client and assemble GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          node ugn/scripts/verify-game-assets.mjs upstream
          node ugn/scripts/audit-vanilla-resources.mjs upstream
          test -s upstream/dist/index.html
          mkdir -p public/client
          cp -a upstream/dist/. public/client/
          cp ugn/index.html ugn/landing.css ugn/app.js ugn/scene.js ugn/client-config.js ugn/favicon.svg ugn/server-config.json ugn/mouse-test.html ugn/mouse-test.css ugn/mouse-test.js public/
          cp ugn/THIRD_PARTY_NOTICES.md public/THIRD_PARTY_NOTICES.md
          touch public/.nojekyll
          cat > public/client/ugn-build.json <<'EOF'
          {
            "client": "minecraft-web-client",
            "upstreamCommit": "d7ab705efee3af674421c65e62b660ae470cad6b",
            "upstreamAdvertisedVersions": "1.8-1.21.5",
            "minecraftLatestStable": "26.3",
            "minecraftLatestSupported": false,
            "gameplayVerified": false
          }
          EOF
          test -s public/client/index.html
          test -s public/client/ugn-build.json
          test -s public/client/ugn-vanilla-assets.json
          test -s public/index.html
          test -s public/landing.css
          test -s public/scene.js
          test -s public/server-config.json
          test -s public/mouse-test.html
          test -s public/mouse-test.css
          test -s public/mouse-test.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy compiled client and UGN website
        id: deployment
        uses: actions/deploy-pages@v4
