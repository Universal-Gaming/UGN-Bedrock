name: Validate UGN Java source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check mouse-test.js
          node --check scene.js
          node --check client-config.js
          node --check scripts/theme-client.mjs
          node --check scripts/configure-client.mjs
          node --check scripts/fix-mouse-look.mjs
          node --check scripts/test-mouse-look.mjs
          node --check scripts/install-mouse-controls.mjs
          node --check scripts/polish-mouse-capture.mjs
          node --check scripts/verify-pages-output.mjs
          node --check scripts/fix-server-connection.mjs
      - name: Validate required source files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s mouse-test.html
          test -s mouse-test.css
          test -s mouse-test.js
          test -s scene.js
          test -s client-config.js
          test -s THIRD_PARTY_NOTICES.md
          test -s .github/workflows/deploy-java.yml
          test -s scripts/theme-client.mjs
          test -s scripts/configure-client.mjs
          test -s scripts/fix-mouse-look.mjs
          test -s scripts/test-mouse-look.mjs
          test -s scripts/install-mouse-controls.mjs
          test -s scripts/polish-mouse-capture.mjs
          test -s scripts/verify-pages-output.mjs
          test -s scripts/fix-server-connection.mjs
          grep -q 'ugn-free-look' scripts/install-mouse-controls.mjs
          grep -q 'game-mount' index.html
          grep -q 'space-scene' index.html
          grep -q 'window.location.assign(gameUrl.href)' app.js
          ! grep -q 'createElement("iframe")' app.js
          grep -q 'UGN same-tab home navigation' scripts/theme-client.mjs
