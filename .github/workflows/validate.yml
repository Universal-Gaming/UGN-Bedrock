name: Validate UGN Bedrock foundation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser and gateway JavaScript
        run: |
          node --check config.js
          node --check app.js
          node --check gateway/server.mjs
      - name: Validate required site files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s config.js
          test -s gateway/server.mjs
